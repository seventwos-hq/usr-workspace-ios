name: security
# gitleaks runs on every push to any branch and every PR (pushed range only).
# Dependency checks (osv-scanner, cargo-deny) skip themselves unless a lockfile or deny.toml changed.
# Full-history and full-dependency scans stay in the weekly dev-VM scan.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: dev-vm
    env:
      EVENT: ${{ github.event_name }}
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$PWD"
      - run: bash .forgejo/scripts/security-check.sh gitleaks
  dependencies:
    runs-on: dev-vm
    env:
      EVENT: ${{ github.event_name }}
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$PWD"
      - run: bash .forgejo/scripts/security-check.sh deps
